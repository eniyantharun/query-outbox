name: Release

# Publishing is triggered by a version tag you push yourself:
#
#   npm version minor
#   git push --follow-tags
#
# No bot ever commits to this repository. The tag is the only trigger, and the
# job refuses to publish if the tag and package.json disagree.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC). There is no NPM_TOKEN secret.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      # A tag that does not match the manifest would publish a version nobody
      # can trace back to a commit. Fail before anything reaches the registry.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      - name: Verify
        run: npm run verify

      - name: Publish
        run: npm publish --access public
        env:
          # Set here rather than in .npmrc on purpose: provenance can only be
          # generated by a supported CI with OIDC, so a repo-wide setting would
          # make a local publish fail on a developer machine.
          NPM_CONFIG_PROVENANCE: true

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
