name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      # tsdown needs Promise.withResolvers, which landed in Node 22, so the
      # bundler cannot run on the oldest supported runtime. That is a
      # constraint on building this package, not on using it: the emitted
      # output targets es2022 and the suite above proves it runs on Node 20.
      - name: Build
        if: matrix.node != 20
        run: npm run build

      # Validates the published exports map against the real tarball, so a
      # broken ESM/CJS/types resolution is caught here rather than by a user.
      - name: Check published exports
        if: matrix.node != 20
        run: npm run check:exports

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7
